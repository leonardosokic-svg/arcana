<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA</title><style>body{margin:0;background:radial-gradient(ellipse at top,#263453,#0b1020 70%);color:#f4e6c8;font:16px system-ui;min-height:100vh}main{max-width:1000px;margin:auto;padding:24px}h1{text-align:center;letter-spacing:.35em;color:#e6c17a;font: bold 42px Georgia;letter-spacing:.3em}header{text-align:center}section{border:1px solid #806b47;border-radius:16px;padding:20px;margin:20px 0;background:#11192c}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #806b47;background:#202a40;color:#fff;max-width:100%;box-sizing:border-box}button{background:#e6c17a;color:#171526;cursor:pointer}form{display:grid;gap:12px;max-width:480px}#gallery,#spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}.card{border:1px solid #b99a59;border-radius:12px;padding:8px;text-align:center;overflow:hidden}.card img{width:100%;height:260px;object-fit:contain}.back{height:260px;display:grid;place-items:center;background:#202a40;color:#e6c17a;font-size:48px;width:100%}small{white-space:pre-wrap} [hidden]{display:none!important}</style><main><header><h1>ARCANA</h1><p>Viele Karten. Ein gemeinsames Universum.</p></header><p id="status" role="status"></p><section id="login"><h2>Anmelden</h2><form id="auth"><input id="email" type="email" placeholder="E-Mail" required><input id="password" type="password" placeholder="Passwort" required><button>Anmelden</button></form></section><div id="app" hidden><button id="logout">Abmelden</button><section><h2>Deine Legung</h2><select id="mode"><option value="1">Tageskarte</option><option value="3">3 Karten</option><option value="5">5 Karten</option><option value="free">Freie Legung</option></select> <input id="count" type="number" min="1" max="100" value="2" hidden> <button id="draw">Karten ziehen</button><div id="spread"></div></section><section><h2>Neue Karte</h2><form id="upload"><input id="name" placeholder="Kartenname" required maxlength="120"><textarea id="meaning" placeholder="Bedeutung (optional)"></textarea><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button>Hochladen</button></form></section><section><h2>Gemeinsames Deck</h2><button id="refresh">Aktualisieren</button><p id="total"></p><div id="gallery"></div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://ruqsgrcloxzhjsgijwwt.supabase.co','sb_publishable_CB6-31OPyBjlMByfyeSkXg_bUAABVmf');const $=id=>document.getElementById(id);let cards=[],user=null;const msg=t=>$('status').textContent=t;const fail=e=>msg(e.message||String(e));function check(r){if(r.error)throw r.error;return r.data}function el(tag,t){const e=document.createElement(tag);if(t)e.textContent=t;return e}function card(c,label,hidden=false){const d=el('div');d.className='card';if(label)d.append(el('h3',label));const show=()=>{const img=el('img');img.src=c.url||'';img.alt=c.name;d.append(img,el('h3',c.name),el('small',c.meaning||''));};if(hidden){const b=el('button','✦');b.className='back';b.setAttribute('aria-label','Karte aufdecken');b.onclick=()=>{b.remove();show()};d.append(b)}else show();return d}
async function load(){cards=check(await db.from('cards').select('*').order('created_at',{ascending:false}));await Promise.all(cards.map(async c=>{const r=await db.storage.from('tarot-cards').createSignedUrl(c.image_path,3600);c.url=r.data?.signedUrl}));$('gallery').replaceChildren(...cards.map(c=>card(c)));$('total').textContent=cards.length+' Karten';}
async function start(){try{user=check(await db.auth.getSession()).session?.user; $('app').hidden=true;$('login').hidden=!!user;if(!user)return;const m=check(await db.from('members').select('user_id').eq('user_id',user.id).maybeSingle());if(!m){msg('Dein Konto ist noch nicht freigeschaltet.');await db.auth.signOut();$('login').hidden=false;return}$('app').hidden=false;msg('Willkommen bei ARCANA');await load()}catch(e){fail(e)}}
$('auth').onsubmit=async e=>{e.preventDefault();try{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await start()}catch(e){fail(e)}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('refresh').onclick=()=>load().catch(fail);$('mode').onchange=()=>$('count').hidden=$('mode').value!=='free';$('draw').onclick=()=>{const mode=$('mode').value,n=Number(mode==='free'?$('count').value:mode);if(!Number.isInteger(n)||n<1||n>cards.length||n>100)return msg('Nicht genügend Karten oder ungültige Anzahl.');const pool=[...cards];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const labels=mode==='3'?['Vergangenheit','Gegenwart','Zukunft']:mode==='5'?['Situation','Hindernis','Rat','Entwicklung','Ergebnis']:mode==='1'?['Tageskarte']:[];$('spread').replaceChildren(...pool.slice(0,n).map((c,i)=>card(c,labels[i]||'Karte '+(i+1),true)));msg('Deine Legung ist bereit.')};$('upload').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const f=$('file').files[0],ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>10*1024*1024)throw Error('Bitte JPG, PNG oder WebP bis 10 MB wählen.');const path=user.id+'/'+crypto.randomUUID()+'.'+ext;check(await db.storage.from('tarot-cards').upload(path,f));check(await db.from('cards').insert({name:$('name').value.trim(),meaning:$('meaning').value,image_path:path,creator_id:user.id}));e.target.reset();await load();msg('Karte hochgeladen.')}catch(e){fail(e)}finally{b.disabled=false}};start();
</script></html>
